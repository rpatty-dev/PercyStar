[package]
name = "rpf9_explorer"
version = "1.3.7"
edition = "2021"

[[bin]]
name = "PercyStar"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
flate2 = "1.0"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
rusty-opus = "1.2"
texture2ddecoder = "0.1.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
